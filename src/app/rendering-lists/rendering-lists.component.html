<div class="phoneListContainer">
  <h2>Cell phone list</h2>
  <ul class="phoneList">
    <li *ngFor="let phone of phones">
      <h3>{{ phone.model }}</h3>
      <p>{{ phone.description }}</p>
      <span [ngClass]="phone.soldOut ? 'unavailable' : 'available' ">{{ phone.soldOut ? "Sold out" : "Available" }}</span>
    </li>
  </ul>
</div>
